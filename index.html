<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Movie Content Generator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0d14;
      color: #fff;
      padding: 30px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    h1 {
      margin-bottom: 8px;
    }

    .sub {
      color: #9ca3af;
      margin-bottom: 24px;
    }

    .input-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #2b3140;
      background: #121722;
      color: #fff;
      font-size: 16px;
    }

    input:focus {
      outline: none;
      border-color: #f5a623;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 14px 20px;
      cursor: pointer;
      font-weight: 700;
      background: #f5a623;
      color: #111;
      margin-top: 5px;
    }

    button:hover {
      opacity: 0.9;
    }

    .card {
      background: #121722;
      border: 1px solid #242b39;
      border-radius: 16px;
      padding: 20px;
      margin-top: 20px;
    }

    .movie-grid {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 24px;
    }

    .poster {
      width: 100%;
      border-radius: 14px;
      display: block;
    }

    .backdrop {
      width: 100%;
      margin-top: 20px;
      border-radius: 14px;
      display: block;
    }

    .meta {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 15px 0;
    }

    .pill {
      padding: 8px 12px;
      border-radius: 999px;
      background: #1d2432;
      border: 1px solid #2e3748;
      font-size: 14px;
    }

    .overview {
      line-height: 1.7;
      color: #d5d9e2;
    }

    .player-wrap {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .player-wrap iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    textarea {
      width: 100%;
      min-height: 300px;
      margin-top: 12px;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #2b3140;
      background: #0c111b;
      color: #fff;
      font-family: Consolas, monospace;
      font-size: 13px;
      line-height: 1.5;
      resize: vertical;
    }

    .error {
      color: #ff7d7d;
    }

    .loading {
      color: #f5a623;
    }

    @media (max-width: 760px) {
      body {
        padding: 15px;
      }

      .movie-grid {
        grid-template-columns: 1fr;
      }

      .poster {
        max-width: 320px;
        margin: auto;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Movie Content Generator</h1>

  <div class="sub">
    Search movie + paste Abyss player URL + generate ready Blogger HTML.
  </div>

  <div class="input-group">
    <label>Movie Name</label>
    <input
      id="movieName"
      type="text"
      placeholder="Example: Doraemon Nobita and the New Steel Troops"
    />
  </div>

  <div class="input-group">
    <label>Abyss Player URL or Iframe</label>
    <input
      id="abyssInput"
      type="text"
      placeholder="https://player.abyssplayer.com/WZmzBKE18"
    />
  </div>

  <button onclick="searchMovie()">Generate Movie Content</button>

  <div id="result"></div>

</div>

<script>

  // ================================
  // ADD YOUR TMDB API KEY HERE
  // ================================

  const API_KEY = "2453b53d5bae160b2c2b18d4d80791ba";

  // ================================

  const POSTER_BASE = "https://image.tmdb.org/t/p/w500";
  const IMAGE_BASE = "https://image.tmdb.org/t/p/original";


  async function searchMovie() {

    const movieName =
      document.getElementById("movieName").value.trim();

    const abyssInput =
      document.getElementById("abyssInput").value.trim();

    const result =
      document.getElementById("result");

    if (!movieName) {
      result.innerHTML =
        '<div class="card error">Please enter movie name.</div>';
      return;
    }

    result.innerHTML =
      '<div class="card loading">Searching movie...</div>';

    try {

      const searchURL =
        "https://api.themoviedb.org/3/search/movie" +
        "?api_key=" +
        encodeURIComponent(API_KEY) +
        "&query=" +
        encodeURIComponent(movieName);

      const searchResponse =
        await fetch(searchURL);

      if (!searchResponse.ok) {
        throw new Error("TMDb search failed");
      }

      const searchData =
        await searchResponse.json();

      if (
        !searchData.results ||
        searchData.results.length === 0
      ) {
        result.innerHTML =
          '<div class="card error">Movie not found.</div>';
        return;
      }

      const firstMovie =
        searchData.results[0];

      const detailsURL =
        `https://api.themoviedb.org/3/movie/${firstMovie.id}` +
        `?api_key=${encodeURIComponent(API_KEY)}` +
        `&append_to_response=credits`;

      const detailsResponse =
        await fetch(detailsURL);

      const movie =
        await detailsResponse.json();

      const title =
        movie.title || "";

      const originalTitle =
        movie.original_title || title;

      const year =
        movie.release_date
          ? movie.release_date.split("-")[0]
          : "";

      const releaseDate =
        movie.release_date || "";

      const genres =
        movie.genres && movie.genres.length
          ? movie.genres.map(g => g.name).join(", ")
          : "";

      const rating =
        typeof movie.vote_average === "number"
          ? movie.vote_average.toFixed(1)
          : "";

      const runtime =
        movie.runtime
          ? movie.runtime + " min"
          : "";

      const language =
        movie.original_language
          ? movie.original_language.toUpperCase()
          : "";

      const overview =
        movie.overview || "";

      const poster =
        movie.poster_path
          ? POSTER_BASE + movie.poster_path
          : "";

      const backdrop =
        movie.backdrop_path
          ? IMAGE_BASE + movie.backdrop_path
          : "";

      const cast =
        movie.credits &&
        movie.credits.cast
          ? movie.credits.cast
              .slice(0, 6)
              .map(x => x.name)
              .join(", ")
          : "";

      let director = "";

      if (
        movie.credits &&
        movie.credits.crew
      ) {
        const foundDirector =
          movie.credits.crew.find(
            x => x.job === "Director"
          );

        director =
          foundDirector
            ? foundDirector.name
            : "";
      }

      const playerHTML =
        buildPlayerHTML(abyssInput);

      const bloggerHTML = `
<div class="nova-movie-post">

  <h2>Now Playing</h2>

  ${playerHTML}

  <div style="
    display:grid;
    grid-template-columns:220px 1fr;
    gap:24px;
    margin-top:25px;
    align-items:start;
  ">

    <div>

      ${
        poster
          ? `
      <img
        src="${poster}"
        alt="${escapeHTML(title)} Poster"
        style="
          width:100%;
          border-radius:14px;
          display:block;
        "
      />
      `
          : ""
      }

    </div>

    <div>

      <h2>${escapeHTML(title)}</h2>

      <p>
        <strong>Original Title:</strong>
        ${escapeHTML(originalTitle)}
      </p>

      <p>
        <strong>Release Date:</strong>
        ${escapeHTML(releaseDate)}
      </p>

      <p>
        <strong>Year:</strong>
        ${escapeHTML(year)}
      </p>

      <p>
        <strong>Genre:</strong>
        ${escapeHTML(genres)}
      </p>

      <p>
        <strong>Runtime:</strong>
        ${escapeHTML(runtime)}
      </p>

      <p>
        <strong>Language:</strong>
        ${escapeHTML(language)}
      </p>

      <p>
        <strong>TMDb Rating:</strong>
        ${escapeHTML(rating)}
      </p>

      <p>
        <strong>Director:</strong>
        ${escapeHTML(director)}
      </p>

      <p>
        <strong>Cast:</strong>
        ${escapeHTML(cast)}
      </p>

    </div>

  </div>

  <h3 style="margin-top:30px;">
    About this title
  </h3>

  <p>
    ${escapeHTML(overview)}
  </p>

  ${
    backdrop
      ? `
  <img
    src="${backdrop}"
    alt="${escapeHTML(title)} Backdrop"
    style="
      width:100%;
      border-radius:14px;
      margin-top:20px;
    "
  />
  `
      : ""
  }

</div>
      `.trim();


      result.innerHTML = `

        <div class="card">

          ${
            playerHTML
              ? `
              <h2>Player Preview</h2>
              ${playerHTML}
              `
              : ""
          }

          <div class="movie-grid">

            <div>

              ${
                poster
                  ? `
                  <img
                    class="poster"
                    src="${poster}"
                    alt="${escapeHTML(title)}"
                  />
                  `
                  : "No poster available"
              }

            </div>

            <div>

              <h2>
                ${escapeHTML(title)}
              </h2>

              <div class="meta">

                <span class="pill">
                  Year: ${escapeHTML(year)}
                </span>

                <span class="pill">
                  Rating: ${escapeHTML(rating)}
                </span>

                <span class="pill">
                  Runtime: ${escapeHTML(runtime)}
                </span>

                <span class="pill">
                  Language: ${escapeHTML(language)}
                </span>

              </div>

              <p>
                <strong>Genre:</strong>
                ${escapeHTML(genres)}
              </p>

              <p>
                <strong>Director:</strong>
                ${escapeHTML(director)}
              </p>

              <p>
                <strong>Cast:</strong>
                ${escapeHTML(cast)}
              </p>

              <h3>
                About this title
              </h3>

              <p class="overview">
                ${escapeHTML(overview)}
              </p>

            </div>

          </div>

          ${
            backdrop
              ? `
              <img
                class="backdrop"
                src="${backdrop}"
                alt="${escapeHTML(title)} Backdrop"
              />
              `
              : ""
          }

        </div>


        <div class="card">

          <h3>
            Ready Blogger HTML
          </h3>

          <textarea id="bloggerHTML">${escapeTextarea(bloggerHTML)}</textarea>

          <button onclick="copyHTML()">
            Copy Blogger HTML
          </button>

        </div>

      `;

    }

    catch (error) {

      console.error(error);

      result.innerHTML =
        '<div class="card error">Something went wrong. Check API key.</div>';

    }

  }


  function buildPlayerHTML(input) {

    if (!input) {
      return "";
    }

    // Full iframe pasted
    if (
      input.toLowerCase().includes("<iframe")
    ) {

      const srcMatch =
        input.match(/src=["']([^"']+)["']/i);

      if (!srcMatch) {
        return "";
      }

      input =
        srcMatch[1];

    }

    // Only allow normal https URL
    if (
      !input.startsWith("https://")
    ) {
      return "";
    }

    return `
<div
  style="
    position:relative;
    width:100%;
    padding-top:56.25%;
    background:#000;
    overflow:hidden;
    border-radius:14px;
  "
>

  <iframe
    src="${escapeHTML(input)}"
    style="
      position:absolute;
      top:0;
      left:0;
      width:100%;
      height:100%;
      border:0;
    "
    scrolling="no"
    allowfullscreen
  ></iframe>

</div>
    `.trim();

  }


  function copyHTML() {

    const text =
      document.getElementById("bloggerHTML");

    navigator.clipboard
      .writeText(text.value)
      .then(() => {
        alert("Blogger HTML copied!");
      });

  }


  function escapeHTML(value) {

    return String(value || "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  function escapeTextarea(value) {

    return String(value || "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;");

  }

</script>

</body>
</html>
